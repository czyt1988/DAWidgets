name: Build & Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows / Qt 6 / MSVC
            os: windows-latest
            qt-arch: win64_msvc2022_64
          - name: Linux / Qt 6 / GCC
            os: ubuntu-latest
            qt-arch: linux_gcc_64

    env:
      # 测试与示例都是 GUI 程序，CI 上没有显示服务器，统一用 offscreen 平台插件
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: ${{ matrix.qt-arch }}
          cache: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DDAWIDGETS_BUILD_SHARED=OFF
          -DDAWIDGETS_BUILD_DEMO=OFF
          -DDAWIDGETS_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # 单文件合并版是仓库提交的生成物，这里在 Windows 上额外编译并冒烟运行一次，
      # 防止 src-amalgamate 与 src/ 失步（合并文件无法在 Linux 上重新生成，故只在 Windows 做）。
      - name: Configure single-file amalgamation example (Windows)
        if: runner.os == 'Windows'
        run: >
          cmake -S . -B build-amalgamate
          -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"
          -DDAWIDGETS_BUILD_DEMO=OFF
          -DDAWIDGETS_BUILD_TESTS=OFF
          -DDAWIDGETS_BUILD_AMALGAMATE_DEMO=ON

      - name: Build and smoke-test amalgamated sources (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake --build build-amalgamate --config Release --target dawidgets_amalgamate_demo --parallel
          .\build-amalgamate\examples\amalgamate_demo\Release\dawidgets_amalgamate_demo.exe --smoke
